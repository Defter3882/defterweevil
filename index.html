<!DOCTYPE html>
<html>
<head>
    <title>专属聊天室</title>
</head>
<body>
    <div id="chatbox" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll;"></div>
    <input type="text" id="message" placeholder="输入消息...">
    <button onclick="sendMessage()">发送</button>

    <script>
        // 替换为你部署好的后端 WebSocket 地址
        const ws = new WebSocket('wss://your-backend-url.onrender.com'); 
        const chatbox = document.getElementById('chatbox');

        ws.onmessage = (event) => {
            chatbox.innerHTML += `<p style="color: blue;">对方: ${event.data}</p>`;
        };

        function sendMessage() {
            const input = document.getElementById('message');
            ws.send(input.value);
            chatbox.innerHTML += `<p style="color: green;">我: ${input.value}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
